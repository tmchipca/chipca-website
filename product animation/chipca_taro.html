<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chipca – Taro Chips</title><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#41302f;--bg2:#2b2122}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:radial-gradient(circle at 50% 50%,var(--bg1),var(--bg2) 75%);overflow:hidden;font-family:system-ui,sans-serif;color:#f6e9d3;touch-action:pan-y}
svg{width:100%;height:100%;display:block;overflow:visible}
.pack:not(.active){display:none}
.ray{transform-box:fill-box;transform-origin:center;opacity:0;animation:burst 1s cubic-bezier(.2,1.25,.4,1) var(--d) forwards,breathe 5s ease-in-out calc(var(--d) + 1.2s) infinite alternate}
@keyframes burst{0%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.25) rotate(var(--r))}25%{opacity:1}100%{opacity:1;transform:none}}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.035) rotate(.6deg)}}
.bag{transform-box:fill-box;transform-origin:50% 60%;animation:pop 1.1s cubic-bezier(.2,1.4,.4,1) both}
.float{animation:float 4s ease-in-out 2.2s infinite alternate}
@keyframes pop{0%{opacity:0;transform:scale(.8) translateY(60px)}50%{opacity:1}100%{opacity:1;transform:none}}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.pack.leaving .ray{animation:collapse .5s cubic-bezier(.5,0,.9,.5) forwards}
@keyframes collapse{from{opacity:1;transform:none}to{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.25) rotate(var(--r))}}
.pack.leaving .bag{animation:out .5s ease-in forwards}
@keyframes out{from{opacity:1;transform:none}to{opacity:0;transform:scale(.9)}}
.ui{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
.ui>*{pointer-events:auto}
#label{font-weight:800;font-size:20px;letter-spacing:.02em;text-shadow:0 2px 10px #0008}
.row{display:flex;align-items:center;gap:14px}
.nav{width:44px;height:44px;border-radius:50%;border:0;background:#d9382c;color:#fff;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px #0006}
.dots{display:flex;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:#f6e9d355;cursor:pointer}
.dot.on{background:#f6e9d3;transform:scale(1.25)}
.rp{background:transparent;border:1.5px solid #f6e9d3aa;color:#f6e9d3;border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600;cursor:pointer}
.single .row{display:none}
@media (prefers-reduced-motion:reduce){.ray,.bag,.float{animation:none;opacity:1}}
</style></head><body class="single">

<div class="ui"><div id="label"></div>
<div class="row"><button class="nav" id="prev" aria-label="Previous pack">&#8249;</button><div class="dots" id="dots"></div><button class="nav" id="next" aria-label="Next pack">&#8250;</button></div>
<button class="rp" id="replay">Replay</button></div>
<script>
const cfg=[{"name": "Taro Chips", "bg1": "#173c3b", "bg2": "#0e2223"}];
const packs=[...document.querySelectorAll('.pack')],n=packs.length;
const dots=document.getElementById('dots'),label=document.getElementById('label');
cfg.forEach((c,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label',c.name);b.onclick=()=>show(i);dots.appendChild(b)});
let cur=0,lock=false;
function activate(k){cur=k;packs.forEach(p=>p.classList.remove('active','leaving'));const p=packs[k];void p.getBoundingClientRect();p.classList.add('active');
const c=cfg[k],s=document.documentElement.style;s.setProperty('--bg1',c.bg1);s.setProperty('--bg2',c.bg2);label.textContent=c.name;
[...dots.children].forEach((d,j)=>d.classList.toggle('on',j===k))}
function show(i){if(lock)return;const k=((i%n)+n)%n;
 if(k===cur){activate(k);return}
 lock=true;packs[cur].classList.add('leaving');setTimeout(()=>{activate(k);lock=false},520)}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('replay').onclick=()=>activate(cur);
if(n>1){addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1)});
let x0=null;addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1));x0=null})}
activate(0);
</script></body></html>
